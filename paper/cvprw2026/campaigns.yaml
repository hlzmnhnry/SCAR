description: Sequences and settings of the CVPRW 2026 evaluation, taken from config/ at tag v1.0.0-cvprw2026. Times in microseconds.
calibration:
  kalibr: {camera: calibration/kalibr_camera.json, extrinsics: calibration/kalibr_extrinsics.json}
  naive: {camera: calibration/naive_camera.json, extrinsics: calibration/naive_extrinsics.json}
image_step: 10
collection:
  tracking: {maximum_features: 500, perform_fm_outlier_rejection: true, fm_ransac_reprojection_threshold: 1.0, fm_ransac_confidence: 0.95,
    fm_ransac_maximum_iterations: 2000, minimum_pixel_distance: 30.0}
  image_matching: {collect_new_geofeatures_every_nth_image: 2, minimum_detections: 50, minimum_inliers: 20, matcher_type: superpoint-lightglue,
    filter_aerial_satellite_matches: true, hom_magsac_reprojection_threshold: 3.0, hom_magsac_confidence: 0.95, hom_magsac_maximum_iterations: 2000,
    filter_by_slope: true, slope_window: 15, slope_threshold: 5, minimum_confidence: 0.5}
  dataset: {pixels_per_meter: 5, update_to_real_ppm: true, footprint_type: yaw_enclosing, footprint_enlargement: 0.0}
collection_vl:
  tracking: {perform_tracking: false, maximum_features: 2048, minimum_pixel_distance: 5.0}
  image_matching:
    collect_new_geofeatures_every_nth_image: 1
    minimum_detections: 50
    minimum_inliers: 20
    matcher_type: roma
    matcher_kwargs: {max_num_keypoints: 2048}
    filter_aerial_satellite_matches: true
    hom_magsac_reprojection_threshold: 3.0
    hom_magsac_confidence: 0.95
    hom_magsac_maximum_iterations: 2000
    filter_by_slope: false
    minimum_confidence: 0.3
  dataset: {pixels_per_meter: 5, update_to_real_ppm: true, footprint_type: yaw_enclosing, footprint_square_size: 1000.0, image_step: 10}
