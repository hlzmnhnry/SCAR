name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install ".[references,legacy,dev]"
      - name: Lint
        run: ruff check scar tests
      # unit, synthetic and system tests on CPU; regression tests skip without the LTC data
      - name: Test
        run: python -m pytest -q
